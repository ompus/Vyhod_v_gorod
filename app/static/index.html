<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Выход в город</title>
  <link rel="stylesheet" href="/static/css/app.css">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🛴</text></svg>">
</head>
<body>

  <div class="app-layout">
    <!-- Sidebar -->
    <aside class="sidebar">
      <div class="sidebar-header">
        <div class="brand">
          <div class="brand-icon">🛴</div>
          <span>Выход в город</span>
        </div>
        <button id="btn-new-chat" class="btn-new-chat">
          <span>+</span> Новый диалог
        </button>
      </div>

      <!-- Conversations History -->
      <div id="conversations-list" class="conversations-list">
        <!-- Conversation items will be rendered here -->
      </div>

      <!-- User Profile Footer -->
      <div class="sidebar-footer">
        <div class="user-profile">
          <div id="user-avatar" class="avatar">U</div>
          <span id="user-name" class="user-name">Пользователь</span>
        </div>
        <button id="btn-logout" class="btn-logout" title="Выйти">Выход</button>
      </div>
    </aside>

    <!-- Main Chat Window -->
    <main class="chat-container">
      <!-- Header -->
      <header class="chat-header">
        <div class="header-info">
          <h2>Ростовская справочная система</h2>
        </div>
      </header>

      <!-- Messages Stream Wrapper -->
      <div id="messages-wrapper" class="messages-wrapper">
        <!-- Rendered messages will appear here -->
      </div>

      <!-- Chat Input Form -->
      <div class="chat-input-wrapper">
        <div class="input-box">
          <textarea
            id="chat-input"
            class="chat-input"
            rows="2"
            placeholder="Куда пойдём сегодня?"
          ></textarea>
          <button id="btn-send" class="btn-send" title="Отправить">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
              <line x1="22" y1="2" x2="11" y2="13"></line>
              <polygon points="22 2 15 22 11 13 2 9 22 2"></polygon>
            </svg>
          </button>
        </div>
      </div>
    </main>
  </div>

  <!-- Authentication Modal -->
  <div id="auth-modal" class="modal-overlay hidden">
    <div class="auth-card">
      <div class="auth-header">
        <div style="font-size: 36px;">🛴</div>
        <h3 id="auth-title" class="auth-title">Вход в систему</h3>
        <p style="font-size: 13px; color: var(--text-secondary); margin-top: 4px;">
          Многопользовательский доступ к городскому агенту
        </p>
      </div>

      <div class="auth-tabs">
        <div id="tab-login" class="auth-tab active">Вход</div>
        <div id="tab-register" class="auth-tab">Регистрация</div>
      </div>

      <form id="auth-form" class="auth-form">
        <div class="form-group">
          <label class="form-label" for="input-username">Имя пользователя</label>
          <input id="input-username" class="form-input" type="text" placeholder="login" required>
        </div>

        <div class="form-group">
          <label class="form-label" for="input-password">Пароль</label>
          <input id="input-password" class="form-input" type="password" placeholder="••••••••••••" required>
        </div>

        <div id="auth-error" class="auth-error"></div>

        <button id="auth-submit-btn" class="btn-primary" type="submit">Войти</button>
        <button id="btn-guest" class="btn-guest" type="button">⚡ Демо-версия без логинки</button>
      </form>
    </div>
  </div>

  <script type="module" src="/static/js/app.js?v=20261018_2"></script>
</body>
</html>
